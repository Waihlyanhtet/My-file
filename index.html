<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 8 Months Anniversary ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; /* စာသားတွေကို အဖြူရောင်ပြောင်းလိုက်ပါတယ် (နောက်ခံနဲ့ ကြည့်ကောင်းအောင်) */
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* နောက်ခံပုံ (Background Image) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/FfnRVsj4/IMG-20260521-213240-808.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65); /* နောက်ခံကို နည်းနည်းပိုမှိန်ပေးထားပါတယ် */
            z-index: -1;
        }

        /* အဖြူကွက်ကို မှန်ကြည်ရောင် ပြောင်းလဲလိုက်တဲ့နေရာ */
        .container {
            background: rgba(255, 255, 255, 0.15); /* အဖြူရောင်ကို အလင်းပေါက် ၁၅% ပဲ ထားတော့ပါတယ် */
            padding: 25px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.25); /* အနားသတ်ကို မှန်ကြည်ရောင်လေး ခတ်ထားပါတယ် */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 85%;
            width: 340px;
            backdrop-filter: blur(15px); /* နောက်ခံကို ခပ်ဝါးဝါး မှန်ကြည်ပုံစံ ပေါ်စေပါတယ် */
            -webkit-backdrop-filter: blur(15px);
            animation: fadeIn 2s ease-in-out;
        }

        /* စာအပေါ်က ပုံ (Main Image) */
        .main-img {
            width: 100%;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 20px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* စာလုံးတွေ ပိုထင်ရှားအောင် အရိပ်ထည့်ထားပါတယ် */
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 5px;
            white-space: pre-line;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); /* စာလုံးတွေ ပိုထင်ရှားအောင် အရိပ်ထည့်ထားပါတယ် */
        }

        .heart {
            color: #ff4d6d;
            font-size: 1.4rem;
            animation: beat 1s infinite alternate;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="main-img" src="https://i.postimg.cc/XZDJk7wV/IMG-20260521-213238-726.jpg" alt="Our Memory">
        
        <h1>Happy 8 Months Anniversary <span class="heart">❤️</span></h1>
        
        <p>Happy 8 months ပါ ချစ်ဆုံးလေးယေ
နောင်နှစ်ပေါင်းများစွာထိ ကိုကိုတို့ တူတူ ချစ်သွားကြမယ်နော် 
ကိုကို့အနားမှာ တစ်သက်လုံး ဆိုးတူတူကောင်းတူတူ ရှိနေပေးပါ 
ကိုကိုတို့နှစ်ယောက် သာယာတဲ့ဘဝတစ်ခုကို တူတူတည်ဆောက်ကြမယ်နော် 
ချစ်ဆုံးကို အများရီးချစ်တယ်
အာဘွား 😘😘😘</p>
    </div>

</body>
</html>
