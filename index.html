<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 8 months anniversary ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a001f;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 350px;
            animation: fadeIn 2s ease-in-out;
        }
        img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 20px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
        }
        .heart {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: beat 1s infinite alternate;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ကောင်မလေးနဲ့ ပုံ Link ကို ဒီမှာထည့်ပါ -->
        <img src="https://imgur.com/a/0De4Xc4">
        
        <h1>For My Special One <span class="heart">❤️</span></h1>
        
        <!-- စာသားကို စိတ်ကြိုက်ပြင်ပါ -->
        <p>"Happy 8 months ပါ ချစ်ဆုံးလေးယေ
 နောင်နှစ်ပေါင်းများစွာထိ ကိုကိုတို့ တူတူ ချစ်သွားကြမယ်နော် 
ကိုကို့အနားမှာ တစ်သက်လုံး ဆိုးတူတူကောင်းတူတူ ရှိနေပေးပါ 
ကိုကိုတို့နှစ်ယောက် သာယာတဲ့ဘဝတစ်ခုကို တူတူတည်ဆောက်ကြမယ်နော် 
ချစ်ဆုံးကို အများရီးချစ်တယ်
အာဘွား😘😘😘"</p>
    </div>

</body>
</html>
